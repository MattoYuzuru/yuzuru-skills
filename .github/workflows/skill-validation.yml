name: Repository validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate repository
        run: ./yuzuru validate --strict
      - name: Parse Python without bytecode output
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path(".").rglob("*.py"):
              if ".git" not in path.parts:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Check shell helpers
        run: shellcheck yuzuru skill install.sh skills/google-ai-search/scripts/*.sh
      - name: Check credential-free help
        run: python3 scripts/smoke_scripts.py
      - name: Run helper unit tests
        run: python3 scripts/run_tests.py
      - name: Validate eval contracts
        run: python3 scripts/run_evals.py
