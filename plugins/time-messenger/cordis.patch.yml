- insert:
    - id: yuzuru-skill-filesystem-time-messenger
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: yuzuru-time-messenger
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/yuzuru-time-messenger/skills/', baseUrl))"
