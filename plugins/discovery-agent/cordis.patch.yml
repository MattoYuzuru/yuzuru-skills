- insert:
    - id: yuzuru-skill-filesystem-discovery-agent
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: yuzuru-discovery-agent
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/yuzuru-discovery-agent/skills/', baseUrl))"
