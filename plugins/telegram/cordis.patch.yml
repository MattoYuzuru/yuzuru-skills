- insert:
    - id: yuzuru-skill-filesystem-telegram
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: yuzuru-telegram
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/yuzuru-telegram/skills/', baseUrl))"
